name: Sincronizar OneDrive ao vivo

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-onedrive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Baixar planilha do OneDrive e gerar data.json
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: python scripts/atualizar_dados.py

      - name: Salvar e Commit no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          if git diff --quiet -- data.json; then
            echo "A planilha foi validada, mas não houve alteração no data.json."
            exit 0
          fi

          git add data.json
          git commit -m "auto: atualização da planilha do OneDrive [$(date +'%Y-%m-%d %H:%M')]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
